{% extends 'base.html' %}
{% block title %}Checkout - AI Bookstore{% endblock %}
{% block content %}
<h1>Checkout</h1>
{% if cart_items %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="shipping_address">Shipping address</label>
  <textarea id="shipping_address" name="shipping_address" required></textarea>
  <label for="payment_method">Payment method</label>
  <select id="payment_method" name="payment_method">
      <option value="mock">Mock</option>
      <option value="card">Card</option>
      <option value="wallet">Wallet</option>
    </select>
  <label for="payment_token">Payment token (mock)</label>
  <input id="payment_token" name="payment_token" value="tok_demo">
  <button type="submit">Place Order</button>
</form>
{% else %}
<p>Your cart is empty.</p>
{% endif %}
{% endblock %}
