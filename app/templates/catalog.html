{% extends 'base.html' %}
{% block title %}Catalog - AI Bookstore{% endblock %}
{% block content %}
<h1>{{ _('Catalog') }}</h1>
<form method="get">
  <label for="category_id">Category</label>
  <select id="category_id" name="category_id" onchange="this.form.submit()">
    <option value="">All</option>
    {% for category in categories %}
    <option value="{{ category.id }}" {% if selected == category.id %}selected{% endif %}>{{ category.name }}</option>
    {% endfor %}
  </select>
</form>
<div class="grid">
  {% for book in books %}
  <article class="card">
    <img src="{{ book.cover_image_url }}" alt="{{ book.title }}">
    <h3><a href="{{ url_for('web.book_detail', book_id=book.id) }}">{{ book.title }}</a></h3>
    <p>{{ book.author }}</p>
    <p>${{ book.price }}</p>
  </article>
  {% endfor %}
</div>
{% endblock %}
