{% extends 'base.html' %}
{% block title %}Login - AI Bookstore{% endblock %}
{% block content %}
<h1>{{ _('Login') }}</h1>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Email <input name="email" type="email" required></label>
  <label>{{ _('Password') }} <input name="password" type="password" required></label>
  <button type="submit">{{ _('Login') }}</button>
</form>
{% endblock %}
