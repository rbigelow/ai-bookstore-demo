{% extends 'base.html' %}
{% block title %}Register - AI Bookstore{% endblock %}
{% block content %}
<h1>{{ _('Create account') }}</h1>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>{{ _('Full name') }} <input name="full_name" required></label>
  <label>Email <input name="email" type="email" required></label>
  <label>{{ _('Password') }} <input name="password" type="password" required></label>
  <button type="submit">{{ _('Register') }}</button>
</form>
{% endblock %}
